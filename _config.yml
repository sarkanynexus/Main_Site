title: "Sarkany Nexus"
description: "Dark fantasy fiction, boardgame design, and maker projects by Sándor Sárkány"
url: "https://sarkanynexus.com"            # e.g., https://yourdomain.com
baseurl: ""        # e.g., /portfolio if your site is at a subpath
permalink: /:collection/:name/

# When true, the public site shows a simple coming-soon page (nav links hidden).
# Set to false when you are ready to go live with content.
coming_soon: true

# Social profile links (icons in footer + Contact). Leave url empty to hide.
# Supported icons: x, instagram, youtube, facebook, linkedin, discord, github, tiktok, bluesky, email
social:
  - name: Email
    icon: email
    url: "mailto:info@sarkanynexus.com"
  - name: Instagram
    icon: instagram
    url: "https://instagram.com/sarkanynexus"
  - name: X (Twitter)
    icon: x
    url: "https://x.com/sarkanynexus"
  - name: YouTube
    icon: youtube
    url: "https://youtube.com/@sarkanynexus"
  # - name: Discord
  #   icon: discord
  #   url: "https://discord.gg/yourinvite"

collections:
  stories:   { output: true }
  updates:   { output: true }   # boardgame devlog
  projects:  { output: true }   # portfolio items
defaults:
  - scope: { path: "", type: "stories" }
    values: { layout: story, published: true }
  - scope: { path: "", type: "updates" }
    values: { layout: update, published: true }
  - scope: { path: "", type: "projects" }
    values: { layout: project, published: true }
markdown: kramdown
kramdown:
  input: GFM
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - AGENTS.md
  - docs
  - .agents
  - .cursor
  - vendor
  - node_modules

