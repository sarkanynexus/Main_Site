---
layout: default
---
<article>
  <section class="story-box">
    <header class="story-header">
      <h1>{{ page.title }}</h1>
      <p class="muted">{{ page.date | date: "%Y-%m-%d" }}</p>
      {% if page.excerpt %}
        <p class="muted">{{ page.excerpt }}</p>
      {% endif %}
    </header>

    {{ content }}
  </section>
</article>
